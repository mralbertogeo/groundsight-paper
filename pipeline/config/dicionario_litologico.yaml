# Dicionário de-para v2.2 (final v1) — revisado pelo hidrogeólogo em 09/08/2026
# (amostra de 60 descrições; ver histórico no repositório).
# Mudanças da revisão: aluviao e rocha_sa_sed criadas; termos de
# alteração movidos de rocha_alterada para saprolito; rocha_fraturada
# mantida SOMENTE para fraturado/fissurado sem alteração (pendente de
# confirmação final — para fundir com saprolito, mover os termos).
# A ORDEM importa: primeira classe que casar vence.
# Matching: minúsculas, sem acento, substring.

aluviao:
  - aluvi

rocha_sa_sed:              # rochas sedimentares (Tubarão/Itararé etc.)
