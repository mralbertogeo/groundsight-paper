  - siltito
  - argilito
  - folhelho
  - ritmito
  - conglomerado
  - tilito
  - varvito
  - diamictito
  - calcario
  - lamito
  - turbidito
  - marga

solo_coluviao:
  - solo
  - coluvi
  - aterro
  - "terra vegetal"
  - areia
  - argila
  - cascalho
  - seixo
  - silte
  - laterit
  - sediment
  - "material organico"

saprolito:                 # inclui "rocha alterada" do perfurador (revisão)
  - saprolito
  - alterad
  - intemperiz
  - decompost
  - "solo residual"
  - regolito
  - "solo de alteracao"
  - "semi-alterada"
  - "semi alterada"
  - friavel

rocha_fraturada:           # fraturada/fissurada SEM alteração
  - fraturad
